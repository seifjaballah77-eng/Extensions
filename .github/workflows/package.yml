name: Package Seif Extensions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seif-ai/**'
      - 'seif-privacy/**'
      - 'seif-download/**'
      - 'seif-new-tab/**'
      - 'seif-translate/**'
      - '.github/workflows/package.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension: [seif-ai, seif-privacy, seif-download, seif-new-tab, seif-translate]
    steps:
      - uses: actions/checkout@v4
      - name: Create extension ZIP
        run: |
          mkdir -p dist
          cd "${{ matrix.extension }}"
          zip -r "../dist/${{ matrix.extension }}.zip" . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extension }}-zip
          path: dist/${{ matrix.extension }}.zip
          if-no-files-found: error
          retention-days: 30
