name: Build individual Seif extension ZIPs
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests, popup files, and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          folders = sorted(pathlib.Path('.').glob('*/manifest.json'))
          if not folders:
              raise SystemExit("No extension manifests found")
          for manifest in folders:
              data = json.loads(manifest.read_text(encoding='utf-8'))
              folder = manifest.parent
              popup = data.get('action', {}).get('default_popup')
              override = data.get('chrome_url_overrides', {})
              for rel in [popup, *override.values()]:
                  if rel and not (folder / rel).is_file():
                      raise SystemExit(f"Missing referenced page: {folder / rel}")
              print("OK", manifest)
          PY
          find . -path './.git' -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Package each extension separately
        run: |
          mkdir -p dist
          for folder in seif-ai seif-privacy seif-download seif-new-tab seif-translate seif-capture seif-image seif-weather seif-calculator seif-bookmarks seif-watch; do
            if [ -f "$folder/manifest.json" ]; then
              archive="$folder"; [ "$folder" = "seif-new-tab" ] && archive="seif-hub"; zip -qr "dist/$archive.zip" "$folder"
            fi
          done
      - name: Publish ZIPs for direct Seif Hub downloads
        shell: bash
        run: |
          mkdir -p downloads
          cp dist/*.zip downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish extension ZIP downloads for Seif Hub"
            git push
          fi
      - name: Publish separate ZIP downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: seif-extensions-build-${{ github.run_number }}
          name: Seif Extensions build ${{ github.run_number }}
          make_latest: true
          files: dist/*.zip
